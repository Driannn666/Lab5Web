
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum JavaScript</title>
</head>
<body>
    <h1>Praktikum 5 JavaScript Dasar</h1>

    <p id="pesan">Konten awal.</p>

<h2>Bilangan Genap atau Ganjil</h2>

<label for="bilangan">Masukkan bilangan bulat:</label>
<input type="number" id="bilangan" step="1">

<button type="button" onclick="cekBilangan()">Periksa</button>
<p id="hasilBilangan"></p>

<h2>Ubah Warna Halaman</h2>

<button type="button"
    onclick="ubahWarnaLatar('lightgreen')">
    Latar Hijau
</button>

<button type="button"
    onclick="ubahWarnaLatar('white')">
    Latar Putih
</button>

<button type="button"
    onclick="ubahWarnaLatar('lightyellow')">
    Latar Kuning
</button>
<h2>Daftar Menu Makanan</h2>

<label>
    <input type="checkbox" class="menu" value="5000">
    Ayam Goreng — Rp5.000
</label><br>

<label>
    <input type="checkbox" class="menu" value="500">
    Tempe — Rp500
</label><br>

<label>
    <input type="checkbox" class="menu" value="2500">
    Telur Dadar — Rp2.500
</label>

<p>Total: Rp<span id="total">0</span></p>
   
<h2>Kalkulator Nilai Mahasiswa</h2>

<label for="tugas">Nilai Tugas:</label>
<input type="number" id="tugas" min="0" max="100"><br><br>

<label for="uts">Nilai UTS:</label>
<input type="number" id="uts" min="0" max="100"><br><br>

<label for="uas">Nilai UAS:</label>
<input type="number" id="uas" min="0" max="100"><br><br>

<button type="button" onclick="hitungNilai()">
    Hitung Nilai
</button>

<p id="hasilNilai"></p>

<p id="teksTambahan">Ini adalah teks yang bisa disembunyikan.</p>

<button type="button" onclick="toggleTeks()">
    Sembunyikan / Tampilkan
</button>
  
<script src="script.js"></script>
</body>
</html>
